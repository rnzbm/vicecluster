<html>
<head>
<meta charset="utf-8">
<meta name="theme-id" content="vice1">
<meta name="theme-title" content="GTA VI Bucharest">
<meta name="theme-family" content="vice1">
<meta name="theme-mode" content="sport">
<meta name="theme-ship" content="true">
<meta name="theme-bottom" content="720">
<meta name="safe-top" content="8">

<!-- shared values the bindings use -->
<meta name="let:vKmh" content="smooth(kmh, 14)">
<meta name="let:vRpm" content="smooth(rpm, 18)">
<meta name="let:pull" content="!(throttle &lt;= 0.5)">
<meta name="let:cue" content="ok(vRpm) &amp;&amp; pull &amp;&amp; vRpm >= P.shiftAt">
<meta name="let:blink" content="flash(2.5, cue)">
<meta name="let:eng" content="smooth(engineHp, 12)">
<meta name="let:boost" content="smooth(boostBar, 10)">
<meta name="let:speedValid" content="typeof kmh === 'number' &amp;&amp; ok(kmh)">
<meta name="let:wanted" content="when(speedValid, when(kmh >= P.wantedKmh[4], 5, when(kmh >= P.wantedKmh[3], 4, when(kmh >= P.wantedKmh[2], 3, when(kmh >= P.wantedKmh[1], 2, when(kmh >= P.wantedKmh[0], 1, 0))))), 0)">
<script type="application/json" id="theme-params">
{ "maxKmh": 300, "maxRpm": 7000, "shiftFrom": 4600, "shiftAt": 6000, "upCue": 5600,
  "nA": 0.020958, "nB": 0.958084,
  "boostMax": 1.5, "engMaxHp": 390, "gMax": 1.2, "gR": 36,
  "wheelAnimation": { "frames": 8, "cyclesPerKmh": 0.02, "maxCycles": 1.8 },
  "launchSmoke": { "throttleMin": 0.7, "maxKmh": 45, "minRpm": 1200,
    "burstSeconds": 1.5, "attackSeconds": 0.12, "fadeSeconds": 0.45 },
  "wantedKmh": [50, 90, 130, 170, 210], "oilRed": 132, "coolRed": 106,
  "power": { "w": 320, "h": 8 } }
</script>

<style>
@font-face { font-family: "Archivo108"; font-weight: 100 900; src: url(../lci1/fonts/Archivo-wdth108.woff2) format("woff2"); }
@font-face { font-family: "ArchivoN"; font-weight: 100 900; src: url(../lci1/fonts/Archivo.woff2) format("woff2"); }
@font-face { font-family: "ViceWanted"; font-weight: 500; src: url(assets/wanted-stars.ttf) format("truetype"); }
:root {
  --ground: #070411; --field: #35166a; --panel: #160e32; --box: #291844; --line: #b485e8;
  --ice: #4ce6f3; --ice-off: #174d63; --red: #ff477b; --red-off: #63214c; --red-tint: #f064b5;
  --red-dark: #41112d; --pale: #ffe5db; --amber: #ffb481; --text: #fff5ef; --text-2: #dfc6ec;
  --dim: #9784b4; --track: #291741; --tyre: #f0dfeb; --none: rgba(0, 0, 0, 0);
  --pink: #ff80c4; --violet: #a57df4;
}
html, body { margin: 0; background: #000; }
svg { display: block; }
text { font-family: "ArchivoN"; fill: var(--text); font-variant-numeric: tabular-nums lining-nums; }
.big   { font-family: "Archivo108"; font-size: 112px; font-weight: 600; letter-spacing: -2.24px; }
.val   { font-family: "Archivo108"; font-size: 44px; font-weight: 600; }
.vs    { font-family: "Archivo108"; font-size: 24px; font-weight: 600; }
.wanted-stars { font-family: "ViceWanted"; font-size: 40px; font-weight: 500; }
.scale { font-family: "Archivo108"; font-size: 30px; font-weight: 500; fill: var(--text-2); stroke: var(--ground); stroke-width: 2px; paint-order: stroke fill; }
.clock { font-family: "Archivo108"; font-size: 40px; font-weight: 500; }
.unit  { font-size: 18px; font-weight: 500; fill: var(--text-2); }
.lab   { font-size: 18px; font-weight: 600; letter-spacing: 1.44px; fill: var(--text-2); }
.sub   { font-size: 22px; font-weight: 500; fill: var(--text-2); }
.corner { font-size: 24px; font-weight: 500; fill: var(--dim); }
.hid { fill-opacity: 0; }
.ico path { fill: none; stroke: var(--text-2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.seg { fill: var(--track); }
.brand { font-family: "Archivo108"; font-weight: 800; fill: var(--text); }
.micro { font-size: 12px; font-weight: 600; letter-spacing: 2.5px; fill: var(--dim); }
.footer-label { font-size: 11px; font-weight: 600; letter-spacing: 2px; fill: var(--text-2); }
.footer-value { font-family: "Archivo108"; font-size: 40px; font-weight: 500; }
</style>
<style data-design-build>[data-gauge]:not([data-keep]), [data-gauge]:not([data-keep]) *,
[data-text], [data-text] *,
[data-leds], [data-leds] *,
[data-rect], [data-rect] *,
[data-guide], [data-guide] *,
[data-sprite], [data-sprite] * { visibility: hidden !important; }</style>

</head>
<body>
<svg id="cluster" width="1920" height="720" viewBox="0 0 1920 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="hexclip"><polygon id="hexClipPoly"/></clipPath>
    <linearGradient id="fieldg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#234969"/><stop offset=".38" stop-color="#423078"/>
      <stop offset=".72" stop-color="#692c71"/><stop offset="1" stop-color="#994565"/>
    </linearGradient>
    <linearGradient id="viceSunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc09a"/><stop offset=".45" stop-color="#ff80b5"/>
      <stop offset="1" stop-color="#a57df4"/>
    </linearGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c153a"/><stop offset="1" stop-color="#30193f"/>
    </linearGradient>
    <linearGradient id="footerFill" x1="0" y1="0" x2="1" y2=".5">
      <stop offset="0" stop-color="#101b2c"/><stop offset=".3" stop-color="#17122c"/>
      <stop offset=".68" stop-color="#21112d"/><stop offset="1" stop-color="#31182e"/>
    </linearGradient>
    <linearGradient id="footerAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ce6f3"/><stop offset=".5" stop-color="#a57df4"/>
      <stop offset="1" stop-color="#ff80c4"/>
    </linearGradient>
    <!-- the recessed plate the car's own gear readout sits in -->
    <linearGradient id="gearPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17151e"/><stop offset="1" stop-color="#100e17"/>
    </linearGradient>
    <linearGradient id="bucharestFadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070411" stop-opacity=".12"/>
      <stop offset=".68" stop-color="#070411" stop-opacity=".28"/>
      <stop offset="1" stop-color="#070411" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="bucharestFadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070411" stop-opacity=".7"/>
      <stop offset=".32" stop-color="#070411" stop-opacity=".28"/>
      <stop offset="1" stop-color="#070411" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="coreClip">
      <polygon points="773,52 1147,52 1310,318 1147,584 773,584 610,318"/>
    </clipPath>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#3a6" stroke-width="3"/>
    </pattern>
    <g id="vicePalm" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 30Q7 5 2-16" stroke-width="3"/>
      <path d="M2-16Q-11-30-23-18 M2-16Q-12-20-25-7 M2-16Q-4-34 5-39
               M2-16Q16-33 28-22 M2-16Q19-21 30-8 M2-16Q16-12 20 1" stroke-width="2"/>
      <path d="M-18 34H23" stroke-width="1" opacity=".45"/>
    </g>
  </defs>
  <!-- a guide (not drawn by the theme): the top keep-clear zone -->
  <rect data-guide x="0" y="0" width="1920" height="8" fill="url(#hatch)" opacity="0.5"/>

  <rect width="1920" height="720" fill="var(--ground)"/>

  <!-- Cached AI-generated artwork, baked into the static art rather than
       streamed on the car. Source: coresg-normal.trae.ai/api/ide/v1/tool_text_to_image.
       The left strip is the owner's eu2 portrait, cut out onto a generated
       Miami sunset street, clear of both masks (assets/eu2-cluster.jpg). -->
  <g id="bucharestScenes">
    <!-- The hexagon covers the inner scene edges; artwork remains visible
         behind the scale numerals and in the unmasked native lamp areas. -->
    <image x="0" y="22" width="448" height="594" preserveAspectRatio="xMidYMax slice"
           href="assets/eu2-cluster.jpg"/>
    <image x="1472" y="22" width="448" height="594" preserveAspectRatio="xMidYMax slice"
           href="assets/bucharest-woman-cluster.jpg"/>
    <rect x="0" y="22" width="448" height="594" fill="url(#bucharestFadeL)"/>
    <rect x="1472" y="22" width="448" height="594" fill="url(#bucharestFadeR)"/>
    <path d="M0 0H325L0 190Z M1650 0H1920V200Z" fill="var(--ground)" data-bleed/>
  </g>

  <!-- the hexagonal field (y 20-616), its slanted edges the two scales -->
  <polygon id="hex" fill="url(#fieldg)"/>
  <g clip-path="url(#hexclip)">
    <path class="edgeL" transform="translate(54 0)" fill="none" stroke="var(--ice)" stroke-opacity=".14" stroke-width="34" stroke-linejoin="miter"/>
    <path class="edgeR" transform="translate(-54 0)" fill="none" stroke="var(--pink)" stroke-opacity=".14" stroke-width="34" stroke-linejoin="miter"/>
    <path class="edgeL" transform="translate(11 0)" fill="none" stroke="var(--ice-off)" stroke-width="18"/>
    <path class="edgeR" transform="translate(-11 0)" fill="none" stroke="var(--red-off)" stroke-width="18"/>
    <path class="edgeR" pathLength="1000" transform="translate(-11 0)" fill="none" stroke="var(--red)" stroke-opacity=".5" stroke-width="18" stroke-dasharray="0 929 71 0"/>
    <path class="edgeR" pathLength="1000" transform="translate(-11 0)" fill="none" stroke="#020308" stroke-width="18" stroke-dasharray="0 927 3 70"/>
    <path class="edgeR" pathLength="1000" transform="translate(-11 0)" fill="none" stroke="#ffb224" stroke-width="18" stroke-dasharray="0 854 6 140"/>
    <path class="edgeL" transform="translate(31 0)" fill="none" stroke="var(--ice)" stroke-opacity=".55" stroke-width="2"/>
    <path class="edgeR" transform="translate(-31 0)" fill="none" stroke="var(--pink)" stroke-opacity=".55" stroke-width="2"/>
  </g>

  <!-- Outlined numerals stay legible over the artwork, with a restrained
       highlight on the reached part of each scale. -->
  <g id="scaleL"></g>
  <g id="scaleR"></g>

  <!-- Side branding stays clear of the scales and the car's warning lamps. -->
  <g id="gtaFlanks">
    <text class="micro" transform="translate(351 243) rotate(-58.45)"
          style="font-size:10px;letter-spacing:2px;fill:var(--ice);opacity:.72">BUCURESTI</text>
    <text class="micro" transform="translate(1488 113) rotate(58.45)"
          style="font-size:10px;letter-spacing:2px;fill:var(--pink);opacity:.72">AFTER HOURS</text>
  </g>

  <!-- inner panel: the hexagon's slope, taller -->
  <polygon points="773,52 1147,52 1310,318 1147,584 773,584 610,318" fill="url(#coreFill)" stroke="var(--line)" stroke-opacity=".6" stroke-width="1.5"/>
  <!-- Restrained coastal artwork stays behind the original telemetry. -->
  <g clip-path="url(#coreClip)" opacity=".16">
    <circle cx="960" cy="382" r="150" fill="url(#viceSunset)"/>
    <path d="M785 412H1135 M785 432H1135 M785 454H1135 M785 480H1135 M785 509H1135"
          stroke="#24152e" stroke-width="10"/>
    <path d="M710 552V408H732V390H750V440H786V422H810V458H840V435H869V478H906V449H930V486H980V455H1004V426H1028V444H1055V418H1080V467H1116V434H1142V403H1162V430H1194V552Z"
          fill="#0b0919"/>
  </g>
  <text class="micro" x="960" y="576" text-anchor="middle" style="fill:var(--text-2)">BMW G11 / BUCHAREST</text>

  <!-- Photo-based camera clearance: x 720-1200, y 0-120.
       Keep information below it; exact on-car calibration is still needed. -->
  <text class="lab" x="960" y="138" text-anchor="middle">ENGINE POWER</text>
  <text x="960" y="184" text-anchor="middle"><tspan id="mEng" class="val hid">291</tspan><tspan class="unit" dx="6">hp</tspan></text>
  <rect x="800" y="200" width="320" height="8" fill="var(--track)"/>

  <!-- A generated interpretation of the user's rear-view BMW photograph.
       The original plate is part of the artwork, not invented UI text. -->
  <g id="bmwG11" clip-path="url(#coreClip)">
    <image x="690" y="286" width="540" height="304" preserveAspectRatio="xMidYMid meet"
           href="assets/bmw-g11-rear-cluster.png"/>
    <!-- Continuous LCI rear light follows the trunk's perspective and
         connects the two lamp clusters above the original plate. -->
    <g id="rearLightBar" fill="none" stroke-linecap="round">
      <path d="M950 424Q1045 426 1144 424" stroke="#ff2450" stroke-width="7" opacity=".16"/>
      <path d="M950 424Q1045 426 1144 424" stroke="#ff183c" stroke-width="3.2" opacity=".85"/>
      <path d="M950 424Q1045 426 1144 424" stroke="#ffae8a" stroke-width="1.2"/>
    </g>
    <!-- Rim centres follow the generated car's perspective. Frames are
         CSL-inspired Y-spoke glyphs in the Wanted atlas. -->
    <ellipse cx="781" cy="496" rx="10.4" ry="29" fill="#101421" transform="rotate(-3 781 496)"/>
    <ellipse cx="876" cy="504" rx="14" ry="39" fill="#101421"/>
    <ellipse cx="781" cy="496" rx=".9" ry="2.2" fill="#5da8d9"/>
    <ellipse cx="876" cy="504" rx="1.2" ry="3" fill="#5da8d9"/>
  </g>
  <!-- Wanted is a cosmetic speed index, not a native warning or target. -->
  <text class="lab" x="820" y="229" style="fill:var(--pink)">WANTED</text>
  <text class="wanted-stars" x="820" y="274" style="fill:#514269;stroke:#b99fd3;stroke-width:1">*****</text>
  <path d="M820 294H1100" stroke="var(--line)" stroke-opacity=".25"/>

  <!-- upper left wing: boost -->
  <text class="lab" x="488" y="100">BOOST</text>
  <text x="488" y="148"><tspan id="mBoost" class="val hid">1.3</tspan><tspan class="unit" dx="6">bar</tspan></text>
  <rect x="488" y="166" width="160" height="6" fill="var(--track)"/>

  <!-- upper right wing: g-force -->
  <text class="lab" x="1358" y="100" text-anchor="end">G-FORCE</text>
  <text x="1358" y="148" text-anchor="end"><tspan id="mG" class="val hid">0.5</tspan><tspan class="unit" dx="6">g</tspan></text>
  <g stroke="var(--pink)" fill="none">
    <circle cx="1414" cy="130" r="40" fill="var(--panel)" stroke-opacity=".8" stroke-width="1.5"/>
    <circle cx="1414" cy="130" r="20" stroke-opacity=".35"/>
    <path d="M1374,130 H1454 M1414,90 V170" stroke-opacity=".35"/>
  </g>

  <!-- speed and gear boxes at the vertices -->
  <polygon points="358,318 398,252 606,252 620,266 620,384 398,384" fill="#284d67" stroke="var(--ice)" stroke-opacity=".65"/>
  <text class="unit" x="604" y="375" text-anchor="end">km/h</text>
  <polygon points="1562,318 1522,252 1314,252 1300,266 1300,384 1522,384" fill="#65324f" stroke="var(--pink)" stroke-opacity=".65"/>
  <text x="1400" y="350" text-anchor="middle"><tspan id="mM" class="val" style="font-size:52px;fill:#b4c8ff">M</tspan><tspan id="mGear" class="big hid" dx="4">2</tspan></text>

  <!-- lower wings: slanted bars (tracks by the script) and the units of their readings -->
  <g id="bars"></g>
  <g id="iFuel" class="ico"><path d="M4,22 V5 a2,2 0 0 1 2,-2 h7 a2,2 0 0 1 2,2 V22 M2,22 H17 M6.5,7 h6 v5 h-6 z M15,11 h1.5 a2,2 0 0 1 2,2 v5 a1.75,1.75 0 0 0 3.5,0 V9 l-3,-3"/></g>
  <text id="wFuel"><tspan id="mFuel" class="vs hid">58</tspan><tspan class="unit" dx="4">%</tspan></text><text class="sub hid" id="sFuel">286 mi</text>
  <g id="iOil" class="ico"><path d="M2,10 l5,1.5 v-1.5 h9 l5,-3.5 l1.5,1.5 l-5.5,6.5 v3.5 h-10 v-4.5 l-5,-1.5 z M11,10 V7 M8.5,7 h5 M22,14 v3"/></g>
  <text id="wOil" text-anchor="end"><tspan id="mOil" class="vs hid">108</tspan><tspan class="unit" dx="4">°C</tspan></text>
  <g id="iCool" class="ico"><path d="M12,2 v11.5 M12,5 h4.5 M12,9 h4.5 M9,16.5 a3,3 0 1 0 6,0 a3,3 0 1 0 -6,0 M1.5,20.5 q2.75,-2.5 5.5,0 M17,20.5 q2.75,-2.5 5.5,0"/></g>
  <text id="wCool" text-anchor="end"><tspan id="mCool" class="vs hid">94</tspan><tspan class="unit" dx="4">°C</tspan></text>

  <!-- The footer data row shares baseline 692. -->
  <g id="bottomBar">
    <rect x="0" y="628" width="1920" height="92" fill="url(#footerFill)"/>
    <path d="M48 628H1872" stroke="url(#footerAccent)" stroke-width="2" opacity=".75"/>
    <path d="M48 632H512 M960 632H1300 M1508 632H1872"
          stroke="url(#footerAccent)" stroke-opacity=".14" stroke-width="4"/>
    <g class="footer-label">
      <text x="60" y="652" style="fill:var(--ice)">LOCAL TIME</text>
      <text x="260" y="652">AMBIENT</text>
      <text x="960" y="652">TOTAL DISTANCE</text>
      <text x="1580" y="652" style="fill:var(--pink)">DRIVE MODE</text>
    </g>
    <path d="M232 648V700 M532 648V700 M924 648V700 M1308 648V700"
          stroke="var(--line)" stroke-opacity=".22"/>
    <path d="M60 707H204" stroke="var(--ice)" stroke-width="2" opacity=".5"/>
    <path d="M260 707H496" stroke="var(--violet)" stroke-width="2" opacity=".35"/>
    <path d="M960 707H1284" stroke="var(--violet)" stroke-width="2" opacity=".35"/>
    <path d="M1580 707H1872" stroke="var(--pink)" stroke-width="2" opacity=".5"/>
    <!-- The gear slot: the car's own gear readout (x 1385-1462, y 665-720) is
         cut out of the art by the build and shows through it. The plate around
         it keeps the cut from reading as a hole in the footer: it is dark
         enough to merge with the car's readout, and the accent rim frames it
         as a step of the bar. The inner subpath is the cut itself (evenodd). -->
    <path fill="url(#gearPlate)" fill-rule="evenodd" stroke="url(#footerAccent)"
          stroke-opacity=".2" stroke-width="1.5"
          d="M1375 646H1472Q1480 646 1480 654V720H1367V654Q1367 646 1375 646ZM1385 720V665H1462V720Z"/>
    <!-- Static wordmark; no animated layer crosses the native lamp strip. -->
    <text class="brand" x="588" y="674" style="font-size:25px;letter-spacing:-.6px">grand theft auto</text>
    <text x="588" y="700" style="font-size:14px;font-weight:600;font-style:italic;letter-spacing:3.6px;fill:var(--ice)">BUCHAREST</text>
    <text class="brand" x="836" y="699" style="font-size:58px;letter-spacing:-5px;fill:url(#viceSunset)">VI</text>
    <g transform="translate(1518 657) skewX(-18)">
      <rect width="7" height="35" fill="var(--ice)"/>
      <rect x="11" width="7" height="35" fill="var(--violet)"/>
      <rect x="22" width="7" height="35" fill="var(--pink)"/>
    </g>
    <text class="footer-value" x="1580" y="692" style="letter-spacing:3px;fill:var(--text)">SPORT</text>
  </g>

  <!-- ===================== the moving parts, bottom to top ===================== -->

  <!-- numerals: a path 96 px outside each edge, numerals inward of it; the
       glow brightens the art's dim numerals up to the last one reached. Its
       field is the one every scale layer reuses (copies of this path moved). -->
  <path id="speedNum" data-gauge="speedNum" fill="none" stroke="none"
        data-needle="-10 78 0 0" data-needle-color="C.none" data-band="0 0" data-band-color="C.none"
        data-glow="58 0 1" data-glow-color="rgb(-1.86, -2.79, -7.44, 1)" data-look="0 0.18 0.01"
        data-value="P.nA + P.nB * (floor((vKmh + 0.5) / 50) * 50 + 25) / P.maxKmh"/>
  <path id="tachNum" data-gauge="tachNum" data-reuse="speedNum" fill="none" stroke="none"
        data-needle="-10 78 0 0" data-needle-color="C.none" data-band="0 0" data-band-color="C.none"
        data-glow="58 0 1" data-glow-color="rgb(-1.86, -2.79, -7.44, 1)" data-look="0 0.18 0.01"
        data-value="P.nA + P.nB * (floor((vRpm + 20) / 1000) * 1000 + 500) / P.maxRpm"/>
  <!-- the tint (a band 54 px in) and the lit trace (31 px in, the glow) -->
  <path id="speedTint" data-gauge="speedTint" data-reuse="speedNum" data-art="off" fill="none" stroke="none"
        data-start="16.43" data-end="16.43" data-from="0.014" data-value="min(vKmh / P.maxKmh, 0.986)"
        data-band="2.6 36.6" data-band-color="alpha(C.ice, when(vKmh > 2.6, 0.38, 0))"
        data-glow="2.5 0 1" data-glow-color="alpha(C.text, when(vKmh > 0.5, 4, 0))" data-look="1 0 1"/>
  <!-- the band (11 px in) and the needle from the edge to 84 px in -->
  <path id="speedBand" data-gauge="speedBand" data-reuse="speedNum" data-art="off" fill="none" stroke="none"
        data-start="16.43" data-end="16.43" data-from="0.008" data-value="min(vKmh / P.maxKmh, 0.992)"
        data-band="-9 9" data-band-color="alpha(C.ice, when(vKmh > 1.5, 1, 0))"
        data-needle="-9.4 74.6 7 0" data-needle-color="C.text"/>
  <path id="tachTint" data-gauge="tachTint" data-reuse="speedNum" data-art="off" fill="none" stroke="none"
        data-start="16.43" data-end="16.43" data-from="0.014" data-value="min(vRpm / P.maxRpm, 0.986)"
        data-band="2.6 36.6" data-band-color="alpha(C.redTint, when(vRpm > 100, 0.94, 0))"
        data-glow="2.5 0 1" data-glow-color="alpha(C.text, when(vRpm > 20, 4, 0))" data-look="1 0 1"/>
  <path id="tachBand" data-gauge="tachBand" data-reuse="speedNum" data-art="off" fill="none" stroke="none"
        data-start="16.43" data-end="16.43" data-from="0.008" data-value="min(vRpm / P.maxRpm, 0.992)"
        data-band="-9 9" data-band-color="alpha(when(cue, when(blink, C.pale, C.red), C.pink), when(vRpm > 60, 1, 0))"
        data-needle="-9.4 74.6 7 0" data-needle-color="C.text"/>

  <!-- Nine lights per side, with a camera gap instead of a continuous row.
       At the shift point all lights flash red. -->
  <g id="shift" data-leds="shift" data-count="18" data-mode="ends" data-light="20 18" data-split="4 7" data-lean="0 530 0"
     data-c0="C.ice" data-c1="C.pink" data-c2="C.red" data-off="when(cue, C.redDark, C.track)"
     data-lit="when(cue, 0, when(ok(vRpm) &amp;&amp; pull, clamp(ceil((vRpm - P.shiftFrom) / (P.shiftAt - P.shiftFrom) * 9), 0, 9), 0))"
     data-flash="blink">
    <rect x="461" y="27" width="998" height="18" fill="none"/>
  </g>

  <!-- the gear box: two upshift chevrons, a connector, then its outline: one path -->
  <path id="gearOutline" data-gauge="gearOutline" data-art="off" fill="none" stroke="none"
        data-band="-1.5 1.5" data-band-color="alpha(C.red, when(cue, 1, 0))" data-value="1"/>
  <path id="chevrons" data-gauge="chevrons" data-reuse="gearOutline" data-art="off" fill="none" stroke="none"
        data-band="-2 2" data-segments="2 33.29" data-value="1"
        data-band-color="alpha(C.red, when(ok(vRpm) &amp;&amp; pull &amp;&amp; vRpm >= P.upCue, 1, 0))"/>

  <!-- Boost and the combustion engine's power. -->
  <g data-leds="boostBar" data-count="64" data-light="4 6" data-c0="C.text" data-off="C.none"
     data-lit="round(clamp(boost / P.boostMax) * 64)"><rect x="488" y="166" width="160" height="6" fill="none"/></g>
  <g data-leds="powerBar" data-count="64" data-light="5 8"
     data-c0="C.ice" data-off="C.none" data-lit="round(clamp(eng / P.engMaxHp) * 64)"><rect x="800" y="200" width="320" height="8" fill="none"/></g>

  <!-- Fuel left, oil and coolant right (one shared field). -->
  <path id="fuelBar" data-gauge="fuelBar" data-art="off" fill="none" stroke="none" data-band="-4.26 4.26" data-start="3" data-end="3"
        data-band-color="C.text" data-value="clamp(fuelPct / 100, 0.02, 1)"/>
  <path id="oilBar" data-gauge="oilBar" data-reuse="fuelBar" data-art="off" fill="none" stroke="none" data-band="-4.26 4.26" data-start="3" data-end="3"
        data-band-color="when(oilC > P.oilRed, C.red, C.text)" data-value="clamp((oilC - 50) / 100, 0.02, 1)"/>
  <path id="coolBar" data-gauge="coolBar" data-reuse="fuelBar" data-art="off" fill="none" stroke="none" data-band="-4.26 4.26" data-start="3" data-end="3"
        data-band-color="when(coolantC > P.coolRed, C.red, C.text)" data-value="clamp((coolantC - 40) / 80, 0.02, 1)"/>

  <!-- g dot and the M hidden out of manual -->
  <circle cx="1414" cy="130" r="6" fill="#f5f8ff" data-rect="gDot"
          data-dx="clamp(smooth(gLat, 10) / P.gMax, -1, 1) * P.gR" data-dy="clamp(smooth(gLon, 10) / P.gMax, -1, 1) * P.gR"/>
  <rect id="modeMask" data-rect="modeMask" x="1340" y="302" width="40" height="44" fill="#65324f" data-show="gearMode !== 'M'"/>

  <!-- readings -->
  <text class="big" x="604" y="350" text-anchor="end" data-text="speedText" data-text-expr="fmt(vKmh)">288</text>
  <!-- the gear: after the M in manual, else centred in the box (logic.extra.js places it) -->
  <text class="big" x="1280" y="350" data-text="gearText" data-width="260" data-cells="3" data-glyphs="PRNDS"
        data-text-expr="when(/^[PRN]$/.test(gearMode), gearMode, when(/^[DS]$/.test(gearMode), gearMode + when(gear > 0, fmt(gear), ''), when(gear === 0, 'N', fmt(gear))))">4</text>
  <!-- Boost and g share a layer; engine power has a centred reading. -->
  <text class="val" x="484" y="148" data-text="val160" data-width="914" data-rate="10"
        data-text-expr="fmt(max(0, boost), 1) + ' ' + fmt(Math.hypot(gLat, gLon), 1)">1.3 0.5</text>
  <text class="val" x="820" y="184" data-text="val156" data-width="290" data-rate="10" data-glyphs="−"
        data-text-expr="fmt(max(0, eng))">291</text>
  <text class="wanted-stars" x="765" y="516" style="fill:#929fb4" data-text="wheelFront"
        data-cells="1" data-glyphs="abcdefgh" data-text-expr="'a'">a</text>
  <text class="wanted-stars" x="859" y="524" style="fill:#929fb4" data-text="wheelRear"
        data-cells="1" data-glyphs="ABCDEFGH" data-text-expr="'A'">A</text>
  <!-- Soft launch puffs reuse the same font texture as wheels and Wanted.
       logic.extra.js supplies motion, opacity and fail-closed telemetry gates. -->
  <text class="wanted-stars" x="850" y="550" data-text="smokeLeft0"
        data-cells="1" data-glyphs="ijkl" data-text-expr="'i'" data-show="false">i</text>
  <text class="wanted-stars" x="850" y="550" data-text="smokeLeft1"
        data-cells="1" data-glyphs="ijkl" data-text-expr="'i'" data-show="false">i</text>
  <text class="wanted-stars" x="1110" y="550" data-text="smokeRight0"
        data-cells="1" data-glyphs="ijkl" data-text-expr="'i'" data-show="false">i</text>
  <text class="wanted-stars" x="1110" y="550" data-text="smokeRight1"
        data-cells="1" data-glyphs="ijkl" data-text-expr="'i'" data-show="false">i</text>
  <text class="wanted-stars" x="820" y="274" data-text="wantedStars" data-width="280" data-cells="5"
        data-null="" data-show="wanted > 0" data-color="C.pale"
        data-text-expr="'*****'.slice(0, wanted)">*****</text>
  <text class="lab" x="1100" y="229" text-anchor="end" data-text="wantedLevel" data-null="OFFLINE"
        data-text-expr="when(speedValid, 'LEVEL ' + wanted, 'OFFLINE')">LEVEL 5</text>
  <!-- the fluids beside their bars (x and width set by the script), the ranges under fuel and battery -->
  <text id="fluids" class="vs" x="440" y="546" data-text="fluids" data-width="1040" data-rate="10"
        data-text-expr="fmt(fuelPct) + ' ' + fmt(oilC) + ' ' + fmt(coolantC)">58 108 94</text>
  <text id="ranges" class="sub" x="460" y="574" data-text="ranges" data-width="260" data-rate="10"
        data-text-expr="fmt(rangeKm) + ' km'">460 km</text>
  <!-- Footer readings reuse one font atlas and the same value baseline. -->
  <text class="footer-value" x="60" y="692" style="fill:var(--ice)" data-text="clock" data-rate="10"
        data-text-expr="when(/^\d{1,2}:\d{2}$/.test(clock), clock, '--:--')">18:05</text>
  <text class="footer-value" x="260" y="692" style="fill:var(--text-2)" data-text="outside" data-rate="10" data-glyphs="−"
        data-text-expr="when(ok(outsideC), when(outsideC &lt; 0, '−', '+') + fmt(abs(outsideC), 1), '--') + ' °C'">+11.5 °C</text>
  <text class="footer-value" x="960" y="692" data-text="odo" data-rate="10" data-null="-- km"
        data-text-expr="when(floor(odoKm) >= 1000, floor(odoKm / 1000) + ' ' + String(floor(odoKm) % 1000 + 1000).slice(1), fmt(floor(odoKm))) + ' km'">39 938 km</text>
</svg>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }
  var r2 = function (v) { return Math.round(v * 100) / 100; };
  var pe = $('theme-params'), P = JSON.parse(pe.textContent);
  function saveParams() { pe.textContent = JSON.stringify(P); }

  /* ---- the hexagon: the mockup's slope (178 across per 290 down), y 54 to 698 ---- */
  var K = 178 / 290, NX = 0.8523, NY = 0.5231;
  var YT = 22, YB = 616, CY = 319, TX = 448, LV = TX - (CY - YT) * K;
  function edgeL(y) { return LV + Math.abs(y - CY) * K; }
  function edgePt(f, side) {
    var y = YB - f * (YB - YT), x = edgeL(y);
    return { x: side < 0 ? x : 1920 - x, y: y, upper: f > 0.5 };
  }
  var hex = [[TX, YT], [1920 - TX, YT], [1920 - LV, CY], [1920 - TX, YB], [TX, YB], [LV, CY]].map(function (p) { return r2(p[0]) + ',' + p[1]; }).join(' ');
  $('hex').setAttribute('points', hex);
  $('hexClipPoly').setAttribute('points', hex);
  var dL = 'M' + TX + ',' + YB + ' L' + r2(LV) + ',' + CY + ' L' + TX + ',' + YT, dR = 'M' + (1920 - TX) + ',' + YB + ' L' + r2(1920 - LV) + ',' + CY + ' L' + (1920 - TX) + ',' + YT;
  Array.prototype.forEach.call(document.querySelectorAll('.edgeL'), function (e) { e.setAttribute('d', dL); });
  Array.prototype.forEach.call(document.querySelectorAll('.edgeR'), function (e) { e.setAttribute('d', dR); });

  /* the scale paths: the edge moved off px across (inward > 0), run 14 px
   * past each end (the scale is 16.43 px in from each end along it) */
  function scalePath(off, side) {
    var E = 14, ya = YB + E, yb = YT - E;
    var pts = [[edgeL(ya) + off, ya], [LV + off, CY], [edgeL(yb) + off, yb]];
    if (side > 0) pts = pts.map(function (p) { return [1920 - p[0], p[1]]; });
    return 'M' + pts.map(function (p) { return r2(p[0]) + ',' + p[1]; }).join(' L');
  }
  $('speedNum').setAttribute('d', scalePath(-96, -1));
  $('tachNum').setAttribute('d', scalePath(-96, 1));
  $('speedTint').setAttribute('d', scalePath(31, -1));
  $('tachTint').setAttribute('d', scalePath(31, 1));
  $('speedBand').setAttribute('d', scalePath(11, -1));
  $('tachBand').setAttribute('d', scalePath(11, 1));

  /* ---- ticks and numerals, as the mockup builds them ---- */
  function buildScale(g, side, majors, minors, toF) {
    minors.concat(majors).forEach(function (v, i) {
      var major = i >= minors.length;
      if (!major && majors.indexOf(v) >= 0) return;
      var f = toF(v), p = edgePt(f, side);
      var nx = side * NX, ny = f === 0.5 ? 0 : (p.upper ? -NY : NY);
      if (f === 0.5) nx = side;
      var a = 5, b = major ? 20 : 12;
      var mx = p.x + nx * b, my = p.y + ny * b, drawTick = true;
      if (my < YT) {
        /* at the hexagon's top corner the outward normal points off the top
         * of the screen, so the last tick is pulled back to the top edge --
         * and dropped outright when nothing but a stub would be left */
        var k = (YT - p.y) / (ny * b);
        drawTick = k > a / b;
        mx = p.x + nx * b * k; my = YT;
      }
      if (drawTick) el('line', { x1: p.x + nx * a, y1: p.y + ny * a, x2: mx, y2: my,
        stroke: major ? '#dfc6ec' : '#8977a3', 'stroke-width': major ? 2.5 : 1.5 }, g);
      if (major) {
        /* the last numeral of each scale sits on the hexagon's top corner:
         * slide it down the edge instead of letting it ride past y 52, where
         * the screen's top edge (safe-top 8) clips its ascenders */
        var ly = Math.max(p.y + 10, 52), ex = edgeL(ly);
        var t = el('text', { 'class': 'scale', x: side < 0 ? ex - 34 : 1920 - ex + 34, y: ly,
          'text-anchor': side < 0 ? 'end' : 'start' }, g);
        t.textContent = v >= 1000 ? v / 1000 : v;
      }
    });
  }
  var i, mM = [], mm = [], rM = [], rm = [];
  for (i = 0; i <= P.maxKmh; i += 50) mM.push(i);
  for (i = 0; i <= P.maxKmh; i += 10) mm.push(i);
  for (i = 0; i <= 7000; i += 1000) rM.push(i);
  for (i = 0; i <= 7000; i += 500) rm.push(i);
  buildScale($('scaleL'), -1, mM, mm, function (v) { return v / P.maxKmh; });
  buildScale($('scaleR'), 1, rM, rm, function (v) { return v / 7000; });

  /* ---- shift lights as the design shows them (the leds layer draws the real ones) ---- */
  for (i = 0; i < 9; i++) {
    el('rect', { 'class': 'seg', x: 464 + i * 26, y: 27, width: 20, height: 18 }, $('shift'));
    el('rect', { 'class': 'seg', x: 1456 - 20 - i * 26, y: 27, width: 20, height: 18 }, $('shift'));
  }

  /* ---- the gear box path: lead-in, chevron, connector, chevron, then the outline ---- */
  var leg = Math.hypot(14, 16), CH = 2 * leg, GAP = Math.hypot(28, 18), LEAD = GAP / 2;
  var gp = [[1478 - LEAD * 14 / leg, 298 + LEAD * 16 / leg], [1478, 298], [1492, 282], [1506, 298], [1478, 316], [1492, 300], [1506, 316],
    [1562, 318], [1522, 252], [1314, 252], [1300, 266], [1300, 384], [1522, 384], [1562, 318]];
  var gd = 'M' + gp.map(function (p) { return r2(p[0]) + ',' + r2(p[1]); }).join(' L');
  var glen = 0, gToOutline = 0;
  for (i = 1; i < gp.length; i++) { glen += Math.hypot(gp[i][0] - gp[i - 1][0], gp[i][1] - gp[i - 1][1]); if (i === 7) gToOutline = glen; }
  $('gearOutline').setAttribute('d', gd);
  $('gearOutline').setAttribute('data-start', r2(gToOutline));
  $('chevrons').setAttribute('d', gd);
  $('chevrons').setAttribute('data-end', r2(glen - 2 * (CH + GAP)));

  /* ---- the slanted fluid bars: tracks, warning zones, the gauges' paths ---- */
  var Y0 = 596, Y1 = 422;
  function barX(y, side, off) { return side < 0 ? edgeL(y) + off : 1920 - edgeL(y) - off - 10; }
  function barPts(side, off, ya, yb) {
    var xa = barX(ya, side, off), xb = barX(yb, side, off);
    return [[xa, ya], [xa + 10, ya], [xb + 10, yb], [xb, yb]].map(function (p) { return r2(p[0]) + ',' + p[1]; }).join(' ');
  }
  function makeBar(id, side, off, warnFrom, warnCol) {
    el('polygon', { points: barPts(side, off, Y0, Y1), fill: '#291741' }, $('bars'));
    if (warnFrom != null) {
      var yw = Y0 - warnFrom * (Y0 - Y1);
      el('polygon', { points: warnFrom > 0.5 ? barPts(side, off, yw, Y1) : barPts(side, off, Y0, yw), fill: warnCol, opacity: 0.45 }, $('bars'));
    }
    $(id).setAttribute('d', 'M' + r2(barX(Y0, side, off) + 5) + ',' + Y0 + ' L' + r2(barX(Y1, side, off) + 5) + ',' + Y1);
  }
  makeBar('fuelBar', -1, 154, 0.12, '#ffb224');
  makeBar('oilBar', 1, 92, 0.82, '#ff2a45');
  makeBar('coolBar', 1, 216, 0.82, '#ff2a45');
  var YV = Y1 + 66, YS = Y1 + 94;
  function place(id, side, off, y) { $(id).setAttribute('x', r2(barX(y, side, off) + (side < 0 ? 26 : -16))); $(id).setAttribute('y', y); }
  function icon(id, side, off) { $(id).setAttribute('transform', 'translate(' + r2(barX(Y1 + 16, side, off) + (side < 0 ? 26 : -40)) + ' ' + (Y1 + 6) + ')'); }
  icon('iFuel', -1, 154); place('wFuel', -1, 154, YV); place('sFuel', -1, 154, YS);
  icon('iOil', 1, 92); place('wOil', 1, 92, YV);
  icon('iCool', 1, 216); place('wCool', 1, 216, YV);
  /* the readings' layers: from left of the fuel reading to the right of the oil one */
  var fx = Math.floor(barX(YV, -1, 154) + 26) - 30, fr = Math.ceil(barX(YV, 1, 92) - 16) + 2;
  $('fluids').setAttribute('x', fx); $('fluids').setAttribute('y', YV); $('fluids').setAttribute('data-width', fr - fx);
  var rx = Math.floor(barX(YS, -1, 154) + 26) - 2;
  $('ranges').setAttribute('x', rx); $('ranges').setAttribute('y', YS); $('ranges').setAttribute('data-width', 130);

  /* the text layers logic.extra.js lays out: their x, width and font */
  P.text = {
    gearText: { x: 1280, w: 260, font: 'f112w600' },
    val160: { x: 484, w: 914, font: 'f44w600' }, val156: { x: 820, w: 290, font: 'f44w600' },
    fluids: { x: fx, w: fr - fx, font: 'f24w600' },
    ranges: { x: rx, w: 130, font: 'f22w500' }
  };
  saveParams();

  /* ---- with the fonts in: where each reading sits (the hidden values hold
   * their units in place), and the cover for the M ---- */
  function span(id) {
    var e = $(id), n = e.getNumberOfChars();
    return { x0: e.getStartPositionOfChar(0).x, x1: e.getEndPositionOfChar(n - 1).x };
  }
  window.addEventListener('load', function () {
    document.fonts.ready.then(function () {
      P.at = {
        boost: r2(span('mBoost').x0), gEnd: r2(span('mG').x1), engEnd: r2(span('mEng').x1),
        gearM: r2(span('mGear').x0), gearMid: 1400,
        fuelEnd: r2(span('mFuel').x1), oilEnd: r2(span('mOil').x1), coolEnd: r2(span('mCool').x1),
        rangeFuel: r2(span('sFuel').x0)
      };
      saveParams();
      var b = $('mM').getBBox(), m = $('modeMask');
      m.setAttribute('x', Math.floor(b.x) - 1); m.setAttribute('y', 350 - 40);
      m.setAttribute('width', Math.ceil(b.width) + 2); m.setAttribute('height', 43);
    });
  });
})();
</script>
</body>
</html>
