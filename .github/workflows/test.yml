# Tests on every push to main and every pull request: the platform (its pins
# and its frozen versions), the ViceCluster tool (the shader rules, every
# theme's logic, the tool against a fake cluster-render, the picker, the
# touch reader), the release tooling, every shipped script parsing on Node 8
# (the head unit's), and two clean builds of each component compared byte for
# byte.
#
# The checks run in one job; each component builds in a job of its own, all
# at once (its reproducible-build check).
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      # first: every later step reads the components' platform copies
      - name: Platform (pins, copies, frozen versions)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node platform/platform.js check ${BASE:+--base "$BASE"}
          node platform/platform.js sync
      - name: ViceCluster (shader rules; every theme on Node 8; the tool against a fake cluster-render on Node 8; the picker on Node 8; the touch reader on mgu-python's Python, as root)
        run: |
          node native/vicecluster/test/shader_lint.js
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine node native/vicecluster/test/themes_test.js
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine node native/vicecluster/test/switch_test.js
          docker run --rm -v "$PWD:/repo" -w /repo node:8.16.2-alpine node native/vicecluster/test/tool_test.js
          docker run --rm -v "$PWD:/repo" -w /repo node:8.16.2-alpine node native/vicecluster/test/picker_test.js
          docker run --rm -v "$PWD:/r:ro" -w /r python:3.12-slim python3 native/vicecluster/test/touch_reader_test.py
      - name: ViceCluster, the GTA VI Bucharest theme (its smoke, its motion, the wanted panel)
        run: |
          node native/vicecluster/test/vice1_smoke_test.js
          node native/vicecluster/test/vice1_motion_test.js
          node native/vicecluster/test/vice1_wanted_test.js
          node native/vicecluster/test/vice2_test.js
      - name: Release tooling
        run: node release/test/release_test.js
      - name: ViceCluster app page on Node 8
        run: docker run --rm -v "$PWD:/repo" -w /repo/apps/vicecluster_app node:8.16.2-alpine node tools/test_page.js --platform-synced
      - name: Node 8 syntax (the head unit's)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine sh -c '
            for f in native/vicecluster/src/*.js native/vicecluster/test/*.js native/vicecluster/themes/built/*.logic.js apps/vicecluster_app/src/*.js platform/tool/cluster_render_client/*/*.js platform/app/vehicle_speed/*/*.js; do node -c "$f" || exit 1; done'

  # every component, as the build matrix's list
  plan:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - id: ids
        run: |
          node -e 'console.log(`ids=${JSON.stringify(require("./release/release.js").components().map((c) => c.id))}`)' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build ${{ matrix.id }}
    runs-on: ubuntu-24.04
    strategy:
      # every component's result, not just the first failure's
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      # two clean builds of each component, compared byte for byte
      - name: Reproducible build
        env:
          ID: ${{ matrix.id }}
        run: node release/release.js check "$ID"
